services:
  api:
    build:
      context: .
    ports:
      - "127.0.0.1:8008:8000"
    volumes:
      - ./data:/app/data:ro
      - ./runs:/app/runs:ro
      - cache:/app/cache
    environment:
      BOBERT_DATA_DIR: /app/data
      BOBERT_RUN_DIR: /app/runs/current
      BOBERT_CACHE_DB: /app/cache/runtime.sqlite
      OSU_CLIENT_ID: ${OSU_CLIENT_ID}
      OSU_CLIENT_SECRET: ${OSU_CLIENT_SECRET}
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      POLARS_MAX_THREADS: "2"
      TORCH_NUM_THREADS: "2"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read()"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  cache:
