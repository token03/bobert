data:
  dataset_path: './data/dataset'
  dataset_seed: 42
  num_workers: 0
  max_seq_len: 4096
  length_buckets: [512, 768, 1024, 1536, 2048, 3072, 4096]
  val_split: 0.1
  min_sr: 2.0
  max_sr: 14.0

model:
  d_model: 384
  n_heads: 8
  n_layers: 9
  dim_feedforward: 960
  dropout: 0.1
  local_attention_window: 128
  global_attention_layers: [2, 5, 8]
  feature_token_dim: 32

components:
  compile_model: false
  compile_mode: "reduce-overhead" 
  compile_dynamic: true
  activation_checkpointing: false
    
pretraining:
  pretrain_size: 300000
  use_length_buckets: true
  batch_size: 64
  num_epochs: 20

  grad_clip_norm: 1.0
  gradient_accumulation_steps: 2

  muon_lr: 0.02
  muon_wd: 0.01

  adam_lr: 2e-4
  adam_wd: 0.05
  adam_betas: [0.9, 0.95]

  min_lr: 1e-6
  cooldown_type: "cosine"
  warmup_ratio: 0.1
  stable_ratio: 0.1

  use_amp: true

  difficulty_loss_weight: 1.0
  mlm_loss_weight: 1.0

  pooling_stats: ["mean", "max", "std"]
  pooling_stat_dim: 256

  masking_ratio: 0.25
  mean_span_length: 4
  
  sampling:
    kde_bandwidth: 0.2
    num_bins: 100
    strength: 0.5

mining:
  top_k: 32
  candidate_k: 512
  block_size: 256
  alignment_size: null
  random_seed: 42
  use_faiss_gpu: true

  ignore_near_star_delta: 0.25

alignment:
  trainable_layers: 0
  use_length_buckets: false
  forward_length_buckets: [1024, 2048, 3072, 4096]
  batch_size: 256
  num_epochs: 1
  alignment_size: null

  embedding_dim: 384
  map_feature_names: ["ar", "cs", "drain_time", "slider_multiplier"]
  map_feature_dim: 64
  pooling_stats: ["mean", "max", "std"]
  pooling_stat_dim: 256
  stats_mixer_dim: 384
  query_pool_num_queries: 1
  query_pool_heads: 16
  query_pool_head_dim: 32
  query_pool_output_dim: 384
  query_pool_dropout: 0.0
  query_pool_use_flash: true

  group_size: 4

  adam_lr: 1e-4
  adam_wd: 0.05
  adam_betas: [0.9, 0.95]
  muon_lr: 0.005
  muon_wd: 0.01
  min_lr: 1e-5
  cooldown_type: "cosine"
  warmup_ratio: 0.05
  stable_ratio: 0.60

  use_amp: true
  grad_clip_norm: 1.0
  gradient_accumulation_steps: 1

  temperature: 0.10

  masking_ratio: 0.15
  mean_span_length: 4

  contrastive_weight: 1.0
