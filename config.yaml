data:
  dataset_path: './data/dataset'
  dataset_seed: 42
  num_workers: 4
  max_seq_len: 4096
  length_buckets: [512, 768, 1024, 1536, 2048, 3072, 4096]
  val_split: 0.1
  min_sr: 2.0
  max_sr: 14.0

model:
  d_model: 384
  n_heads: 8
  n_layers: 9
  dim_feedforward: 960
  dropout: 0.1
  local_attention_window: 128
  global_attention_layers: [2, 5, 8]
  input_tokenizer: "feature_mixer"
  feature_token_dim: 32
  feature_mixer_layers: 1
  feature_pooling: "gated_sum"

components:
  compile_model: true
  compile_mode: "default" 
  compile_dynamic: true
  activation_checkpointing: true
    
pretraining:
  pretrain_size: 100000
  use_length_buckets: true
  batch_size: 64
  num_epochs: 10

  grad_clip_norm: 1.0
  gradient_accumulation_steps: 2

  muon_lr: 0.02
  muon_wd: 0.01

  adam_lr: 2e-4
  adam_wd: 0.05
  adam_betas: [0.9, 0.95]

  min_lr: 1e-6
  cooldown_type: "cosine"
  warmup_ratio: 0.1
  stable_ratio: 0.1

  use_amp: true
  checkpoint_dir: "./experiments/pretrain"

  difficulty_loss_weight: 1.0
  mlm_loss_weight: 1.0

  pooling_stats: ["mean", "max", "std"]
  pooling_stat_dim: 256

  masking_ratio: 0.25
  mean_span_length: 4
  
  sampling:
    kde_bandwidth: 0.2
    num_bins: 100
    strength: 0.5

alignment:
  checkpoint_dir: "./experiments/align"
  model_name: "model"
  trainable_layers: 3
  use_length_buckets: false
  forward_length_buckets: [512, 1024, 2048, 4096]
  batch_size: 64
  num_epochs: 2
  alignment_size: 100000

  embedding_dim: 256
  teacher_dim: 96
  pooling_stats: ["mean", "max", "std"]
  pooling_stat_dim: 256
  contrastive_pooler: "query_attention"
  query_pool_num_queries: 8
  query_pool_heads: 8
  query_pool_head_dim: 32
  query_pool_output_dim: 512
  query_pool_dropout: 0.0
  query_pool_use_flash: true

  group_size: 4
  mining_cache_path: './data/candidates.parquet'

  adam_lr: 3e-5
  adam_wd: 0.05
  adam_betas: [0.9, 0.95]
  muon_lr: 0.003
  muon_wd: 0.01
  min_lr: 1e-6
  cooldown_type: "linear"
  warmup_ratio: 0.05
  stable_ratio: 0.0

  use_amp: true
  grad_clip_norm: 1.0
  gradient_accumulation_steps: 2

  temperature: 0.15

  difficulty_loss_weight: 0.4
  aim_loss_weight: 0.2
  speed_loss_weight: 0.2
  contrastive_weight: 1.0
  graph_weight: 0.3
