data:
  dataset_path: './data/dataset'
  dataset_seed: 42
  num_workers: 1
  pin_memory: false
  persistent_workers: false
  prefetch_factor: 1
  max_seq_len: 4096
  length_buckets: [512, 768, 1024, 1536, 2048, 3072, 4096]
  val_split: 0.1
  min_sr: 2.0
  max_sr: 14.0

model:
  d_model: 384
  n_heads: 8
  n_layers: 9
  dim_feedforward: 960
  dropout: 0.1
  local_attention_window: 128
  global_attention_layers: [2, 5, 8]
  feature_token_dim: 32

components:
  compile_model: false
  compile_mode: "reduce-overhead" 
  compile_dynamic: true
  activation_checkpointing: false

train_defaults: &train_defaults
  epochs: 1
  batch_size: 128
  grad_accum: 1
  grad_clip: 1.0
  precision: bf16-mixed

optim_defaults: &optim_defaults
  adam_lr: 2e-4
  adam_wd: 0.05
  adam_betas: [0.9, 0.95]
  muon_lr: 0.02
  muon_wd: 0.01

schedule_defaults: &schedule_defaults
  adam_min_lr: 1e-6
  warmup_ratio: 0.05
  stable_ratio: 0.1
  cooldown: cosine

pooling_defaults: &pooling_defaults
  pooling_stats: [mean, max, std]
  pooling_stat_dim: 256
     
pretraining:
  <<: [*train_defaults, *optim_defaults, *schedule_defaults, *pooling_defaults]
  pretrain_size: 300000
  use_length_buckets: true
  batch_size: 64
  epochs: 20
  grad_accum: 2
  warmup_ratio: 0.1
  stable_ratio: 0.1

  difficulty_loss_weight: 1.0
  mlm_loss_weight: 1.0

  masking_ratio: 0.25
  mean_span_length: 4
  
  sampling:
    kde_bandwidth: 0.2
    num_bins: 100
    strength: 0.5

mining:
  top_k: 32
  candidate_k: 512
  block_size: 256
  alignment_size: null
  random_seed: 42
  use_faiss_gpu: true

alignment:
  <<: [*train_defaults, *optim_defaults, *schedule_defaults, *pooling_defaults]
  trainable_layers: 0
  use_length_buckets: false
  batch_size: 128
  epochs: 1
  alignment_size: null

  embedding_dim: 256
  map_feature_names: ["ar", "cs", "drain_time", "slider_multiplier"]
  map_feature_dim: 32
  stats_mixer_dim: 384
  query_pool_num_queries: 1
  query_pool_heads: 8
  query_pool_head_dim: 32
  query_pool_output_dim: 256
  query_pool_dropout: 0.0
  query_pool_use_flash: true

  group_size: 4

  adam_lr: 1e-4
  muon_lr: 0.005
  adam_min_lr: 1e-5
  stable_ratio: 0.60

  temperature: 0.10
