data:
  max_seq_len: 2048
  val_split: 0.1
  min_sr: 2.0
  max_sr: 14.0

model:
  d_model: 512
  n_heads: 8
  n_layers: 6
  dim_feedforward: 1280
  dropout: 0.1
  local_attention_window: 256

  
components:
  use_flash_attention: true
  compile_model: true
  compile_mode: "default" 
    
pretraining:
  db_path: './data/beatmap_dataset100k/'
  # db_path: './data/beatmap_dataset50k/'
  batch_size: 8
  num_epochs: 8

  grad_clip_norm: 1.0
  gradient_accumulation_steps: 16

  muon_lr: 0.02
  muon_wd: 0.01

  adam_lr: 2e-4
  adam_wd: 0.05
  adam_betas: [0.9, 0.95]

  min_lr: 1e-6
  cooldown_type: "cosine"
  warmup_ratio: 0.1
  stable_ratio: 0.1

  use_amp: true
  checkpoint_dir: "./experiments"

  difficulty_loss_weight: 1.0
  mlm_loss_weight: 1.0

  masking_ratio: 0.25
  mean_span_length: 4
  
  sampling:
    kde_bandwidth: 0.2
    num_bins: 100
    strength: 0.5

align:
  db_path: './data/beatmap_dataset175k/'
  checkpoint_dir: "./experiments"
  model_name: "model"
  batch_size: 8
  num_epochs: 3

  learning_rate: 3e-5
  min_lr: 1e-6
  cooldown_type: "linear"
  weight_decay: 0.05
  warmup_ratio: 0.05
  stable_ratio: 0.0

  use_amp: true
  grad_clip_norm: 1.0
  gradient_accumulation_steps: 4

  user_tag_classes: 42
  collection_label_classes: 5
  temperature: 0.05

  user_tag_weight: 0.0
  collection_label_weight: 0.2
  difficulty_rating_weight: 0.1
  aim_loss_weight: 0.1
  speed_loss_weight: 0.1
  contrastive_weight: 1.0

  difficulty_decay_scale: 0.3
  cross_label_similarity_factor: 0.2
  same_label_base_similarity: 0.4 

  positive_difficulty_threshold: 0.15
  hard_negative_difficulty_threshold: 0.50

  sampler:
    max_ease_factor: 1.0
    use_kde_anchor_sampling: true
    kde_bandwidth: 0.2
    kde_bins: 100

  recall_k_values: [1, 3, 5]
  recall_difficulty_threshold: 0.20
