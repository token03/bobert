data:
  db_path: './data/beatmap_dataset_test/'
  # db_path: './data/beatmap_dataset/'
  max_seq_len: 1023
  val_split: 0.1
  chunk_size: 1000
    
training:
  batch_size: 8
  num_epochs: 5
  learning_rate: 5e-4
  weight_decay: 0.05
  warmup_ratio: 0.05
  min_lr: 1e-6
  use_amp: true
  checkpoint_dir: "./checkpoints/bert"
  grad_clip_norm: 1.0
  
  use_class_weights: true
  class_weighting_method: "inverse_frequency" 
  
  sampling:
    method: "kde"  
    kde_bandwidth: 0.5
    temperature: 2.0  
    expand_for_augmentation: true
  
model:
  d_model: 512
  n_heads: 8
  n_layers: 6
  dim_feedforward_mult: 4
  dropout: 0.1
  
components:
  use_rope: true
  use_flash_attention: true
  compile_model: true
  
mlm:
  masking_ratio: 0.25