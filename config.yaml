data:
  db_path: './data/beatmap_dataset_test/'
  # db_path: './data/beatmap_dataset/'
  max_seq_len: 1023
  val_split: 0.1
  chunk_size: 1000
    
training:
  batch_size: 8
  num_epochs: 5
  learning_rate: 5e-4
  weight_decay: 0.05
  warmup_ratio: 0.05
  min_lr: 1e-6
  use_amp: true
  checkpoint_dir: "./checkpoints"
  grad_clip_norm: 1.0
  gradient_accumulation_steps: 8
  
  sampling:
    method: "kde"  
    kde_bandwidth: 0.5
    num_bins: 200
    expand_for_augmentation: true

contrastive:
  user_tag_classes: 42
  collection_label_classes: 5
  temperature: 0.1
  num_positives_per_anchor: 2
  user_tag_weight: 1.0
  collection_label_weight: 1.0
  difficulty_rating_weight: 1.0
  
model:
  d_model: 512
  n_heads: 8
  n_layers: 6
  dim_feedforward_mult: 4
  dropout: 0.1
  
components:
  use_flash_attention: true
  compile_model: true
  compile_mode: "default"
  
mlm:
  masking_ratio: 0.25

