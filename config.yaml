data:
  # db_path: './data/beatmap_dataset_test/'
  db_path: './data/beatmap_dataset/'
  max_seq_len: 1023
  val_split: 0.1
  max_samples_per_class:
    aim: 1500
    tech: 1500

model:
  d_model: 512
  n_heads: 8
  n_layers: 6
  dim_feedforward_mult: 4
  dropout: 0.1
  local_attention_window: 128
  
components:
  use_flash_attention: true
  compile_model: true
  compile_mode: "default" 
    
pretraining:
  batch_size: 8
  num_epochs: 5

  learning_rate: 3e-4
  min_lr: 1e-6
  cooldown_type: "cosine"
  weight_decay: 0.05
  warmup_ratio: 0.05
  stable_ratio: 0.1

  use_amp: true
  checkpoint_dir: "./checkpoints"
  grad_clip_norm: 1.0
  gradient_accumulation_steps: 8

  masking_ratio: 0.25
  mean_span_length: 3
  
  sampling:
    method: "kde"  
    kde_bandwidth: 0.6
    num_bins: 200
    expand_for_augmentation: false

finetuning:
  checkpoint_dir: "./checkpoints"
  model_name: "model"
  batch_size: 8
  num_epochs: 3

  learning_rate: 3e-5
  min_lr: 1e-6
  cooldown_type: "linear"
  weight_decay: 0.05
  warmup_ratio: 0.05
  stable_ratio: 0.0

  use_amp: true
  grad_clip_norm: 1.0
  gradient_accumulation_steps: 8

  user_tag_classes: 42
  collection_label_classes: 5
  temperature: 0.1

  user_tag_weight: 0.0
  collection_label_weight: 1.0
  difficulty_rating_weight: 2.0

  positive_difficulty_threshold: 0.25
  hard_negative_difficulty_threshold: 0.5
  sampler:
    max_ease_factor: 1.0
    kde_bandwidth: 0.5
    kde_bins: 200

  validation_k_values: [1, 5, 10]
