data:
  dataset_path: './data/dataset'
  dataset_seed: 42
  max_seq_len: 4096
  val_split: 0.1
  min_sr: 2.0
  max_sr: 14.0

model:
  d_model: 384
  n_heads: 8
  n_layers: 9
  dim_feedforward: 960
  dropout: 0.1
  local_attention_window: 128
  global_attention_layers: [2, 5, 8]


  
components:
  compile_model: true
  compile_mode: "default" 
  activation_checkpointing: true
    
pretraining:
  pretrain_size: 80000
  batch_size: 32
  num_epochs: 10

  grad_clip_norm: 1.0
  gradient_accumulation_steps: 4

  muon_lr: 0.02
  muon_wd: 0.01

  adam_lr: 2e-4
  adam_wd: 0.05
  adam_betas: [0.9, 0.95]

  min_lr: 1e-6
  cooldown_type: "cosine"
  warmup_ratio: 0.1
  stable_ratio: 0.1

  use_amp: true
  checkpoint_dir: "./experiments/pretrain"

  difficulty_loss_weight: 1.0
  mlm_loss_weight: 1.0

  pooling_stats: ["mean", "max", "std"]
  pooling_stat_dim: 256

  masking_ratio: 0.25
  mean_span_length: 4
  
  sampling:
    kde_bandwidth: 0.2
    num_bins: 100
    strength: 0.5

alignment:
  checkpoint_dir: "./experiments/align"
  model_name: "model"
  trainable_layers: 3
  batch_size: 96
  num_epochs: 4

  embedding_dim: 256
  teacher_dim: 96
  pooling_stats: ["mean", "max", "std"]
  pooling_stat_dim: 256
  group_size: 4
  mining_cache_path: './data/mining_cache.parquet'
  alignment_size: 100000

  adam_lr: 3e-5
  adam_wd: 0.05
  adam_betas: [0.9, 0.95]
  muon_lr: 0.003
  muon_wd: 0.01
  min_lr: 1e-6
  cooldown_type: "linear"
  warmup_ratio: 0.05
  stable_ratio: 0.0

  use_amp: true
  grad_clip_norm: 1.0
  gradient_accumulation_steps: 2

  temperature: 0.15

  difficulty_loss_weight: 0.4
  aim_loss_weight: 0.2
  speed_loss_weight: 0.2
  contrastive_weight: 1.0
  graph_weight: 0.3
  status_weight: 0.05

  difficulty_decay_scale: 0.3
  cross_label_similarity_factor: 0.2
  same_label_base_similarity: 0.4 

  sampler:
    max_ease_factor: 1.0
    use_kde_anchor_sampling: true
    kde_bandwidth: 0.2
    kde_bins: 100

  recall_k_values: [1, 3, 5]
  recall_difficulty_threshold: 0.20
