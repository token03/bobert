data:
  max_seq_len: 1023
  val_split: 0.1
  max_samples_per_class:
    aim: 2500
    tech: 2500

model:
  d_model: 512
  n_heads: 8
  n_layers: 6
  dim_feedforward_mult: 4
  dropout: 0.1
  local_attention_window: 256
  cnn_kernel_size: 15

  
components:
  use_flash_attention: true
  compile_model: true
  compile_mode: "default" 
    
pretraining:
  db_path: './data/beatmap_dataset_test/'
  # db_path: './data/beatmap_dataset/'
  batch_size: 8
  num_epochs: 8

  learning_rate: 2e-4
  min_lr: 1e-6
  cooldown_type: "cosine"
  weight_decay: 0.05
  warmup_ratio: 0.1
  stable_ratio: 0.1

  use_amp: true
  checkpoint_dir: "./checkpoints"
  grad_clip_norm: 1.0
  gradient_accumulation_steps: 8

  difficulty_loss_weight: 1.0
  mlm_loss_weight: 1.0

  masking_ratio: 0.3
  mean_span_length: 4
  
  sampling:
    method: "kde"  
    kde_bandwidth: 0.2
    num_bins: 200

finetuning:
  db_path: './data/beatmap_dataset/'
  checkpoint_dir: "./checkpoints"
  model_name: "model"
  batch_size: 8
  num_epochs: 3

  learning_rate: 3e-5
  min_lr: 1e-6
  cooldown_type: "linear"
  weight_decay: 0.05
  warmup_ratio: 0.05
  stable_ratio: 0.0

  use_amp: true
  grad_clip_norm: 1.0
  gradient_accumulation_steps: 4

  user_tag_classes: 42
  collection_label_classes: 5
  temperature: 0.05

  user_tag_weight: 0.0
  collection_label_weight: 1.0
  difficulty_rating_weight: 1.0
  aim_loss_weight: 1.0
  speed_loss_weight: 1.0
  contrastive_weight: 1.0

  difficulty_decay_scale: 0.3
  cross_label_similarity_factor: 0.2
  same_label_base_similarity: 0.4 

  positive_difficulty_threshold: 0.15
  hard_negative_difficulty_threshold: 0.50

  sampler:
    max_ease_factor: 1.0
    use_kde_anchor_sampling: true
    kde_bandwidth: 0.2
    kde_bins: 100

  recall_k_values: [1, 3, 5]
  recall_difficulty_threshold: 0.20
