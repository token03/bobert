data:
  db_path: './data/beatmap_dataset_test/'
  # db_path: './data/beatmap_dataset/'
  max_seq_len: 1023
  val_split: 0.1
  chunk_size: 1000
    
training:
  batch_size: 8
  num_epochs: 5
  learning_rate: 5e-4
  weight_decay: 0.05
  warmup_ratio: 0.05
  min_lr: 1e-6
  use_amp: true
  checkpoint_dir: "./checkpoints/bert"
  grad_clip_norm: 1.0
  
  sampling:
    method: "kde"  
    kde_bandwidth: 0.5
    num_bins: 200
    expand_for_augmentation: true
  
fine_tuning:
  enabled: false
  checkpoint_path: "./checkpoints/bert/checkpoint_epoch_4.pth"
  freeze_base_model: false
  learning_rate: 1e-5
  num_epochs: 3
  difficulty_weight: 0.4
  collection_label_weight: 0.4
  user_tag_weight: 0.2

  batching:
    batch_size: 8
    mix_difficulty: true
    mix_collection_labels: true
    mix_user_tags: false
    

model:
  d_model: 512
  n_heads: 8
  n_layers: 6
  dim_feedforward_mult: 4
  dropout: 0.1
  
components:
  use_rope: true
  use_flash_attention: true
  compile_model: true
  compile_mode: "default"
  
mlm:
  masking_ratio: 0.25