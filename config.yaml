data:
  dataset_path: "./data/dataset"
  dataset_seed: 42

  max_seq_len: 4096
  load_chunk_size: 10000
  length_buckets: [512, 768, 1024, 1536, 2048, 3072, 4096]
  val_split: 0.1

  min_sr: 2.0
  max_sr: 14.0

  dataloader:
    num_workers: 2
    pin_memory: true
    persistent_workers: false
    prefetch_factor: 2

model:
  d_model: 384
  n_heads: 6
  n_layers: 9
  dim_feedforward: 1024
  dropout: 0.1

  local_attention_window: 128
  global_attention_layers: [2, 5, 8]

  feature_token_dim: 16

runtime:
  compile_model: true
  compile_mode: "default"
  compile_dynamic: true
  activation_checkpointing: false

training:
  trainer:
    epochs: 6
    batch_size: 64
    grad_accum: 2
    grad_clip: 1.0
    precision: "bf16-mixed"
    save_checkpoints: true
    use_length_buckets: true

  data:
    sample_size: 60000

  optimizer:
    adam_lr: 2e-4
    adam_wd: 0.05
    adam_betas: [0.9, 0.95]
    muon_lr: 0.01
    muon_wd: 0.01

  scheduler:
    adam_min_lr: 1e-6
    warmup_ratio: 0.1
    stable_ratio: 0.1
    cooldown: "cosine"
    num_cycles: 0.5

  masking:
    ratio: 0.30
    mean_span_length: 3
