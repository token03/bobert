<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Collection Graph Embedding Explorer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="layout">
        <div id="sidebar">
            <h1>Embedding Explorer</h1>
            <div class="control-group">
                <label>FIND BEATMAP (ID)</label>
                <div class="search-container">
                    <input type="text" id="search-input" placeholder="e.g. 123456">
                    <button id="search-btn">GO</button>
                </div>
                <div id="search-error">Beatmap ID not found.</div>
            </div>
            <div class="control-group">
                <label>COLOR MODE</label>
                <select id="color-mode">
                    <option value="stars">Star Rating</option>
                    <option value="status">Ranked Status</option>
                    <option value="bpm">BPM</option>
                    <option value="date">Submission Date</option>
                    <option value="length">Length</option>
                    <option value="maxcombo">Max Combo</option>
                </select>
            </div>
            <div id="selection-panel">
                <div id="empty-state">
                    <p>
                        Click a point or search to view beatmap details
                    </p>
                </div>
                <div id="single-select-panel">
                    <h2>
                        <span>Selected Beatmap</span>
                        <a id="external-link" href="#" target="_blank" title="Open in osu!">↗</a>
                    </h2>
                    <div id="meta-container"></div>
                    <h2>Nearest Neighbors</h2>
                    <div id="neighbor-container"></div>
                </div>
                <div id="multi-select-panel">
                    <h2>Selected Beatmaps (<span id="select-count">0</span>)</h2>
                    <div id="multi-select-container"></div>
                </div>
            </div>
        </div>
        <div id="chart-canvas-wrapper">
        </div>
        <div id="loader">
            <div class="spinner"></div>
        </div>
    </div>
    <div id="hover-tooltip"></div>
    </div>
    <script type="module" src="/index.js"></script>
</body>
</html>
