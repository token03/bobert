services:
  api:
    build:
      context: .
      network: host
    mem_limit: 3.5g
    restart: unless-stopped
    logging:
      driver: local
    ports:
      - "127.0.0.1:8008:8000"
    volumes:
      - ./data:/app/data:ro
      - ./runs:/app/runs:ro
      - ./cache:/app/cache
    environment:
      BOBERT_DATA_DIR: /app/data
      BOBERT_RUN_DIR: /app/runs/current
      BOBERT_CACHE_DB: /app/cache/runtime.sqlite
      BOBERT_MODEL_PATH: /app/runs/current/bobert.pt
      OSU_CLIENT_ID: ${OSU_CLIENT_ID}
      OSU_CLIENT_SECRET: ${OSU_CLIENT_SECRET}
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      POLARS_MAX_THREADS: "2"
      TORCH_NUM_THREADS: "2"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read()"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    logging:
      driver: local
    # IPV6 CAUSE IM CHEAP AND DONT WANNA PAY FOR IPV4 ON HETZNER
    command: tunnel --no-autoupdate --protocol quic --edge-ip-version 6 run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      api:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

# IPV6 CAUSE IM CHEAP AND DONT WANNA PAY FOR IPV4 ON HETZNER
networks:
  default:
    enable_ipv6: true
    ipam:
      config:
        - subnet: "fd00:1337::/64"
