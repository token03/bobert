services:
  api:
    build:
      context: .
      network: host
    mem_limit: 3.5g
    restart: unless-stopped
    volumes:
      - ./data:/app/data:ro
      - ./cache:/app/cache
    environment:
      APP_ENV: production
      FRONTEND_ORIGIN: https://bobert-web.pages.dev
      BOBERT_DATA_DIR: /app/data
      BOBERT_CACHE_DB: /app/cache/runtime.sqlite
      BOBERT_MODEL_PATH: /app/data/bobert.pt
      BOBERT_CONFIG_PATH: /app/config.api.yaml
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY}
      API_SHARED_SECRET: ${API_SHARED_SECRET}
      OSU_CLIENT_ID: ${OSU_CLIENT_ID}
      OSU_CLIENT_SECRET: ${OSU_CLIENT_SECRET}
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      POLARS_MAX_THREADS: "2"
      TORCH_NUM_THREADS: "2"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    # IPV6 CAUSE IM CHEAP AND DONT WANNA PAY FOR IPV4 ON HETZNER
    command: tunnel --no-autoupdate --protocol http2 --edge-ip-version 6 run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - api
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

# IPV6 CAUSE IM CHEAP AND DONT WANNA PAY FOR IPV4 ON HETZNER
networks:
  default:
    enable_ipv6: true
    ipam:
      config:
        - subnet: "fd00:1337::/64"
