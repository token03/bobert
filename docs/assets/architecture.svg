<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1012 208" font-family="Adwaita Sans, Inter, DejaVu Sans, Helvetica, Arial, sans-serif" fill="#23262e">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1 L9,5 L1,9" fill="none" stroke="#23262e" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .box { stroke: #23262e; stroke-width: 1.6; }
      .chip { fill: #ffffff; stroke: #23262e; stroke-width: 1.1; }
      .panel { fill: #f3f4f6; stroke: #23262e; stroke-width: 1.6; }
      .line { fill: none; stroke: #23262e; stroke-width: 1.6; }
      .title { font-size: 13px; font-weight: 700; letter-spacing: 0.06em; }
      .head { font-size: 12.5px; font-weight: 700; }
      .name { font-size: 12.5px; font-weight: 600; }
      .text { font-size: 13px; }
      .detail { font-size: 11.5px; fill: #4a5060; }
      .muted { font-size: 11.5px; fill: #5b6170; }
      .tag { font-size: 10.5px; fill: #5b6170; font-style: italic; }
    </style>
  </defs>

  <rect width="1012" height="208" fill="#ffffff"/>

  <rect class="box" x="20" y="72" width="100" height="56" rx="10" fill="#f6e0e3"/>
  <text class="text" x="70" y="96" text-anchor="middle">.osu</text>
  <text class="text" x="70" y="114" text-anchor="middle">hit objects</text>
  <line class="line" x1="120" y1="100" x2="142" y2="100" marker-end="url(#arrow)"/>

  <rect class="box" x="144" y="52" width="200" height="96" rx="10" fill="#e2def3"/>
  <text class="name" x="244" y="78" text-anchor="middle">Feature tokenizer</text>
  <text class="detail" x="244" y="99" text-anchor="middle">per-ruleset feature groups</text>
  <text class="detail" x="244" y="116" text-anchor="middle">16-d each · concat</text>
  <text class="detail" x="244" y="133" text-anchor="middle">linear → 384 · RMSNorm</text>

  <g transform="translate(324 -120)">
  <rect class="panel" x="44" y="140" width="450" height="168" rx="12"/>
  <text class="title" x="86" y="166">ENCODER BLOCK × 9</text>

  <rect class="box" x="86" y="183" width="190" height="74" rx="10" fill="#fde6c4"/>
  <text class="text" x="181" y="208" text-anchor="middle">RMSNorm</text>
  <text class="text" x="181" y="227" text-anchor="middle">Attention + RoPE</text>
  <text class="detail" x="181" y="246" text-anchor="middle">local ±128 · global at 3, 6, 9</text>
  <line class="line" x1="276" y1="220" x2="289" y2="220" marker-end="url(#arrow)"/>
  <circle cx="302" cy="220" r="11" fill="#ffffff" stroke="#23262e" stroke-width="1.6"/>
  <path class="line" d="M296,220 H308 M302,214 V226"/>
  <line class="line" x1="313" y1="220" x2="327" y2="220" marker-end="url(#arrow)"/>

  <rect class="box" x="329" y="183" width="110" height="74" rx="10" fill="#cfe8f3"/>
  <text class="text" x="384" y="215" text-anchor="middle">RMSNorm</text>
  <text class="text" x="384" y="234" text-anchor="middle">SwiGLU</text>
  <line class="line" x1="439" y1="220" x2="452" y2="220" marker-end="url(#arrow)"/>
  <circle cx="465" cy="220" r="11" fill="#ffffff" stroke="#23262e" stroke-width="1.6"/>
  <path class="line" d="M459,220 H471 M465,214 V226"/>

  <path class="line" d="M64,220 V284 H302 V233" marker-end="url(#arrow)"/>
  <path class="line" d="M320,220 V284 H465 V233" marker-end="url(#arrow)"/>
  </g>
  <line class="line" x1="344" y1="100" x2="406" y2="100" marker-end="url(#arrow)"/>

  <path class="line" d="M800,100 H824 V42 H840" marker-end="url(#arrow)"/>
  <rect class="box" x="842" y="20" width="150" height="44" rx="10" fill="#d9ecdc"/>
  <text class="text" x="917" y="38" text-anchor="middle">Mean pool</text>
  <text class="detail" x="917" y="55" text-anchor="middle">layers 3, 6, 9</text>

  <line class="line" x1="917" y1="64" x2="917" y2="80" marker-end="url(#arrow)"/>
  <rect class="box" x="842" y="82" width="150" height="44" rx="10" fill="#d9ecdc"/>
  <text class="text" x="917" y="100" text-anchor="middle">Adapter</text>
  <text class="detail" x="917" y="117" text-anchor="middle">384 × 384 linear</text>

  <line class="line" x1="917" y1="126" x2="917" y2="142" marker-end="url(#arrow)"/>
  <rect class="box" x="842" y="144" width="150" height="44" rx="10" fill="#f3efc9"/>
  <text class="text" x="917" y="162" text-anchor="middle">Beatmap vector</text>
  <text class="detail" x="917" y="179" text-anchor="middle">384-d · L2</text>
</svg>
