<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 544" font-family="Adwaita Sans, Inter, DejaVu Sans, Helvetica, Arial, sans-serif" fill="#23262e">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1 L9,5 L1,9" fill="none" stroke="#23262e" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .box { stroke: #23262e; stroke-width: 1.6; }
      .chip { fill: #ffffff; stroke: #23262e; stroke-width: 1.1; }
      .panel { fill: #f3f4f6; stroke: #23262e; stroke-width: 1.6; }
      .line { fill: none; stroke: #23262e; stroke-width: 1.6; }
      .title { font-size: 13px; font-weight: 700; letter-spacing: 0.06em; }
      .head { font-size: 12.5px; font-weight: 700; }
      .name { font-size: 12.5px; font-weight: 600; }
      .text { font-size: 13px; }
      .detail { font-size: 11.5px; fill: #4a5060; }
      .muted { font-size: 11.5px; fill: #5b6170; }
      .tag { font-size: 10.5px; fill: #5b6170; font-style: italic; }
    </style>
  </defs>

  <rect width="1000" height="544" fill="#ffffff"/>

  <rect class="box" x="20" y="127" width="120" height="76" rx="10" fill="#f6e0e3"/>
  <text class="text" x="80" y="156" text-anchor="middle">.osu</text>
  <text class="text" x="80" y="174" text-anchor="middle">hit object</text>
  <text class="muted" x="80" y="192" text-anchor="middle">28 features</text>
  <line class="line" x1="140" y1="165" x2="168" y2="165" marker-end="url(#arrow)"/>

  <rect class="panel" x="170" y="20" width="560" height="288" rx="12"/>
  <text class="title" x="190" y="46">FEATURE TOKENIZER</text>

  <text class="head" x="190" y="74">Continuous groups · 16-d each</text>
  <text class="head" x="545" y="74">Categorical · 16-d each</text>

  <g>
    <rect class="chip" x="190" y="84" width="340" height="28" rx="6"/>
    <text class="name" x="200" y="102.5">Position</text>
    <text class="detail" x="298" y="102.5">x, y</text>

    <rect class="chip" x="190" y="120" width="340" height="28" rx="6"/>
    <text class="name" x="200" y="138.5">Incoming jump</text>
    <text class="detail" x="298" y="138.5">distance, direction</text>
    <text class="tag" x="520" y="138.5" text-anchor="end">if motion valid</text>

    <rect class="chip" x="190" y="156" width="340" height="28" rx="6"/>
    <text class="name" x="200" y="174.5">Onset rhythm</text>
    <text class="detail" x="298" y="174.5">log gap, beat phase</text>

    <rect class="chip" x="190" y="192" width="340" height="28" rx="6"/>
    <text class="name" x="200" y="210.5">Hold</text>
    <text class="detail" x="298" y="210.5">duration, beat phase</text>
    <text class="tag" x="520" y="210.5" text-anchor="end">slider or spinner</text>

    <rect class="chip" x="190" y="228" width="340" height="28" rx="6"/>
    <text class="name" x="200" y="246.5">Slider path</text>
    <text class="detail" x="298" y="246.5">length, end offset</text>
    <text class="tag" x="520" y="246.5" text-anchor="end">slider</text>

    <rect class="chip" x="190" y="264" width="340" height="28" rx="6"/>
    <text class="name" x="200" y="282.5">Slider shape</text>
    <text class="detail" x="298" y="282.5">curve residuals, anchors</text>
    <text class="tag" x="520" y="282.5" text-anchor="end">slider</text>
  </g>

  <g>
    <rect class="chip" x="545" y="84" width="170" height="28" rx="6"/>
    <text class="name" x="555" y="102.5">New combo</text>

    <rect class="chip" x="545" y="120" width="170" height="28" rx="6"/>
    <text class="name" x="555" y="138.5">Motion state</text>

    <rect class="chip" x="545" y="156" width="170" height="28" rx="6"/>
    <text class="name" x="555" y="174.5">Repeats</text>
    <text class="tag" x="705" y="174.5" text-anchor="end">slider</text>

    <rect class="chip" x="545" y="192" width="170" height="28" rx="6"/>
    <text class="name" x="555" y="210.5">Red anchors</text>
    <text class="tag" x="705" y="210.5" text-anchor="end">slider</text>

    <rect class="chip" x="545" y="228" width="170" height="28" rx="6"/>
    <text class="name" x="555" y="246.5">Object type</text>
  </g>

  <line class="line" x1="730" y1="165" x2="758" y2="165" marker-end="url(#arrow)"/>
  <rect class="box" x="760" y="110" width="220" height="110" rx="10" fill="#e2def3"/>
  <text class="text" x="870" y="144" text-anchor="middle">Concat 11 × 16 = 176</text>
  <text class="text" x="870" y="168" text-anchor="middle">Linear → 384</text>
  <text class="text" x="870" y="192" text-anchor="middle">RMSNorm</text>


  <text class="muted" x="620" y="324" text-anchor="middle">N objects → N × 384 tokens</text>

  <rect class="panel" x="44" y="356" width="450" height="168" rx="12"/>
  <text class="title" x="86" y="382">ENCODER BLOCK × 9</text>
  <path class="line" d="M870,220 V332 H20 V436 H84" marker-end="url(#arrow)"/>

  <rect class="box" x="86" y="399" width="190" height="74" rx="10" fill="#fde6c4"/>
  <text class="text" x="181" y="424" text-anchor="middle">RMSNorm</text>
  <text class="text" x="181" y="443" text-anchor="middle">Attention + RoPE</text>
  <text class="detail" x="181" y="462" text-anchor="middle">local ±128 · global at 3, 6, 9</text>
  <line class="line" x1="276" y1="436" x2="289" y2="436" marker-end="url(#arrow)"/>
  <circle cx="302" cy="436" r="11" fill="#ffffff" stroke="#23262e" stroke-width="1.6"/>
  <path class="line" d="M296,436 H308 M302,430 V442"/>
  <line class="line" x1="313" y1="436" x2="327" y2="436" marker-end="url(#arrow)"/>

  <rect class="box" x="329" y="399" width="110" height="74" rx="10" fill="#cfe8f3"/>
  <text class="text" x="384" y="431" text-anchor="middle">RMSNorm</text>
  <text class="text" x="384" y="450" text-anchor="middle">SwiGLU</text>
  <line class="line" x1="439" y1="436" x2="452" y2="436" marker-end="url(#arrow)"/>
  <circle cx="465" cy="436" r="11" fill="#ffffff" stroke="#23262e" stroke-width="1.6"/>
  <path class="line" d="M459,436 H471 M465,430 V442"/>

  <path class="line" d="M64,436 V500 H302 V449" marker-end="url(#arrow)"/>
  <path class="line" d="M320,436 V500 H465 V449" marker-end="url(#arrow)"/>

  <line class="line" x1="476" y1="436" x2="516" y2="436" marker-end="url(#arrow)"/>
  <rect class="box" x="518" y="396" width="130" height="80" rx="10" fill="#d9ecdc"/>
  <text class="text" x="583" y="431" text-anchor="middle">Mean pool</text>
  <text class="detail" x="583" y="451" text-anchor="middle">layers 3, 6, 9</text>

  <line class="line" x1="648" y1="436" x2="672" y2="436" marker-end="url(#arrow)"/>
  <rect class="box" x="674" y="396" width="130" height="80" rx="10" fill="#d9ecdc"/>
  <text class="text" x="739" y="431" text-anchor="middle">Adapter</text>
  <text class="detail" x="739" y="451" text-anchor="middle">384 × 384 linear</text>

  <line class="line" x1="804" y1="436" x2="828" y2="436" marker-end="url(#arrow)"/>
  <rect class="box" x="830" y="396" width="150" height="80" rx="10" fill="#f3efc9"/>
  <text class="text" x="905" y="431" text-anchor="middle">Beatmap vector</text>
  <text class="detail" x="905" y="451" text-anchor="middle">384-d · L2</text>
</svg>
