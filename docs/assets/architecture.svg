<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 208" font-family="Adwaita Sans, Inter, DejaVu Sans, Helvetica, Arial, sans-serif" fill="#23262e">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1 L9,5 L1,9" fill="none" stroke="#23262e" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .box { stroke: #23262e; stroke-width: 1.6; }
      .panel { fill: #f3f4f6; stroke: #23262e; stroke-width: 1.6; }
      .line { fill: none; stroke: #23262e; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
      .dot { fill: #23262e; }
      .title { font-size: 12.5px; font-weight: 700; letter-spacing: 0.06em; }
      .name { font-size: 13px; font-weight: 600; }
      .text { font-size: 13px; }
      .detail { font-size: 11.5px; fill: #4a5060; }
    </style>
  </defs>

  <rect width="980" height="208" fill="#ffffff"/>

  <!-- Input -->
  <rect class="box" x="20" y="72" width="100" height="56" rx="10" fill="#f6e0e3"/>
  <text class="name" x="70" y="96" text-anchor="middle">.osu</text>
  <text class="detail" x="70" y="114" text-anchor="middle">hit objects</text>
  <line class="line" x1="120" y1="100" x2="146" y2="100" marker-end="url(#arrow)"/>

  <!-- Feature tokenizer -->
  <rect class="box" x="148" y="58" width="174" height="84" rx="10" fill="#e2def3"/>
  <text class="name" x="235" y="84" text-anchor="middle">Feature tokenizer</text>
  <text class="detail" x="235" y="104" text-anchor="middle">per-ruleset groups</text>
  <text class="detail" x="235" y="121" text-anchor="middle">embed · project · RMSNorm</text>

  <!-- Encoder block panel -->
  <rect class="panel" x="348" y="20" width="426" height="168" rx="12"/>
  <text class="title" x="394" y="47">ENCODER BLOCK × N</text>

  <!-- Entry + Attention + Residual 1 -->
  <line class="line" x1="322" y1="100" x2="392" y2="100" marker-end="url(#arrow)"/>
  <circle class="dot" cx="368" cy="100" r="2.6"/>

  <rect class="box" x="394" y="66" width="130" height="68" rx="10" fill="#fde6c4"/>
  <text class="text" x="459" y="95" text-anchor="middle">RMSNorm</text>
  <text class="text" x="459" y="114" text-anchor="middle">Attention + RoPE</text>

  <line class="line" x1="524" y1="100" x2="548" y2="100" marker-end="url(#arrow)"/>
  <circle cx="561" cy="100" r="11" fill="#ffffff" stroke="#23262e" stroke-width="1.6"/>
  <path class="line" d="M555,100 H567 M561,94 V106"/>
  <path class="line" d="M368,100 V164 H561 V113" marker-end="url(#arrow)"/>

  <!-- SwiGLU + Residual 2 -->
  <line class="line" x1="572" y1="100" x2="614" y2="100" marker-end="url(#arrow)"/>
  <circle class="dot" cx="590" cy="100" r="2.6"/>

  <rect class="box" x="616" y="66" width="96" height="68" rx="10" fill="#cfe8f3"/>
  <text class="text" x="664" y="95" text-anchor="middle">RMSNorm</text>
  <text class="text" x="664" y="114" text-anchor="middle">SwiGLU</text>

  <line class="line" x1="712" y1="100" x2="732" y2="100" marker-end="url(#arrow)"/>
  <circle cx="745" cy="100" r="11" fill="#ffffff" stroke="#23262e" stroke-width="1.6"/>
  <path class="line" d="M739,100 H751 M745,94 V106"/>
  <path class="line" d="M590,100 V164 H745 V113" marker-end="url(#arrow)"/>

  <!-- Output stack -->
  <path class="line" d="M756,100 H792 V42 H810" marker-end="url(#arrow)"/>
  <rect class="box" x="812" y="20" width="148" height="44" rx="10" fill="#d9ecdc"/>
  <text class="name" x="886" y="38" text-anchor="middle">Mean pool</text>
  <text class="detail" x="886" y="55" text-anchor="middle">global layers</text>

  <line class="line" x1="886" y1="64" x2="886" y2="80" marker-end="url(#arrow)"/>
  <rect class="box" x="812" y="82" width="148" height="44" rx="10" fill="#d9ecdc"/>
  <text class="name" x="886" y="100" text-anchor="middle">Adapter</text>
  <text class="detail" x="886" y="117" text-anchor="middle">linear</text>

  <line class="line" x1="886" y1="126" x2="886" y2="142" marker-end="url(#arrow)"/>
  <rect class="box" x="812" y="144" width="148" height="44" rx="10" fill="#f3efc9"/>
  <text class="name" x="886" y="162" text-anchor="middle">Beatmap vector</text>
  <text class="detail" x="886" y="179" text-anchor="middle">L2-normalized</text>
</svg>
