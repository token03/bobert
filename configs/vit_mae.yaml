defaults:
  - base

model:
  type: "vit_mae"
  patch_size: 16
  embed_dim: 768
  n_heads: 12
  n_layers: 12
  dim_feedforward_mult: 4
  decoder_embed_dim: 512
  decoder_n_heads: 8
  decoder_n_layers: 4

training:
  batch_size: 6
  checkpoint_dir: "./checkpoints/vit_mae"
  
data:
  max_seq_len: 256 

mae:
  masking_ratio: 0.75  
  
components:
  use_rope: false  
  use_flash_attention: true
  compile_model: false