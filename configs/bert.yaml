defaults:
  - base

data:
  # db_path: './data/beatmaps_test.db'
  db_path: './data/beatmaps.db'
model:
  type: "bert"
  d_model: 512
  n_heads: 8
  n_layers: 6
  dim_feedforward_mult: 4

training:
  checkpoint_dir: "./checkpoints/bert"

mlm:
  masking_ratio: 0.20
  
components:
  use_rope: true
  use_flash_attention: true
  compile_model: true