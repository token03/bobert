services:
  api:
    mem_limit: 3g
    restart: unless-stopped
    logging:
      driver: local

  bot:
    mem_limit: 128m
    restart: unless-stopped
    logging:
      driver: local

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    logging:
      driver: local
    command: tunnel --no-autoupdate --protocol quic run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      api:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
